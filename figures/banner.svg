<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 380" width="1400" height="380">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fdf4ff">
        <animate attributeName="stop-color" values="#fdf4ff;#f0fbfa;#fff7ed;#fdf4ff" dur="14s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#eff6ff">
        <animate attributeName="stop-color" values="#eff6ff;#fdf2f8;#f0fdfa;#eff6ff" dur="14s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="frame">
      <rect x="0" y="0" width="1400" height="380" rx="28"/>
    </clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <rect x="0" y="0" width="1400" height="380" fill="url(#bgGrad)"/>
    <rect x="0" y="0" width="1400" height="380" fill="url(#glow)"/>

    <g opacity="0.85">
      <line x1="245" y1="120" x2="430" y2="190" stroke="#cbd5e1" stroke-width="1.5"/>
      <line x1="430" y1="190" x2="360" y2="290" stroke="#cbd5e1" stroke-width="1.5"/>
      <line x1="960" y1="110" x2="1145" y2="175" stroke="#cbd5e1" stroke-width="1.5"/>
      <line x1="1145" y1="175" x2="1080" y2="280" stroke="#cbd5e1" stroke-width="1.5"/>
    </g>

    <g>
      <circle cx="245" cy="120" r="16" fill="#FF6B6B" opacity="0.85">
        <animate attributeName="cy" values="120;100;120" dur="6s" repeatCount="indefinite"/>
      </circle>
      <circle cx="430" cy="190" r="10" fill="#4ECDC4" opacity="0.85">
        <animate attributeName="cy" values="190;212;190" dur="7.5s" repeatCount="indefinite"/>
      </circle>
      <circle cx="360" cy="290" r="13" fill="#F2A93B" opacity="0.85">
        <animate attributeName="cy" values="290;268;290" dur="5.2s" repeatCount="indefinite"/>
      </circle>
      <circle cx="960" cy="110" r="12" fill="#9B5DE5" opacity="0.85">
        <animate attributeName="cy" values="110;134;110" dur="6.8s" repeatCount="indefinite"/>
      </circle>
      <circle cx="1145" cy="175" r="17" fill="#FF6B6B" opacity="0.85">
        <animate attributeName="cy" values="175;152;175" dur="8.1s" repeatCount="indefinite"/>
      </circle>
      <circle cx="1080" cy="280" r="9" fill="#4ECDC4" opacity="0.85">
        <animate attributeName="cy" values="280;302;280" dur="5.9s" repeatCount="indefinite"/>
      </circle>
      <circle cx="120" cy="300" r="7" fill="#9B5DE5" opacity="0.6">
        <animate attributeName="cy" values="300;280;300" dur="6.4s" repeatCount="indefinite"/>
      </circle>
      <circle cx="1280" cy="90" r="8" fill="#F2A93B" opacity="0.6">
        <animate attributeName="cy" values="90;112;90" dur="7.1s" repeatCount="indefinite"/>
      </circle>
    </g>

    <g text-anchor="middle" font-family="Segoe UI, Arial, sans-serif">
      <text x="700" y="195" font-size="76" font-weight="800" fill="#0f172a" letter-spacing="4">
        RISETKU
        <animate attributeName="opacity" values="0.92;1;0.92" dur="4s" repeatCount="indefinite"/>
      </text>
      <text x="700" y="240" font-size="20" font-weight="600" fill="#475569" letter-spacing="1">
        Skin Sagging Literature Visual Analytics
      </text>
    </g>

    <g transform="translate(0,330)">
      <path d="M -100 20 Q 100 -10 300 20 T 700 20 T 1100 20 T 1500 20" fill="none" stroke="#FF6B6B" stroke-width="2" opacity="0.35">
        <animateTransform attributeName="transform" type="translate" values="-40 0; 0 0; -40 0" dur="9s" repeatCount="indefinite"/>
      </path>
      <path d="M -100 32 Q 100 8 300 32 T 700 32 T 1100 32 T 1500 32" fill="none" stroke="#4ECDC4" stroke-width="2" opacity="0.35">
        <animateTransform attributeName="transform" type="translate" values="0 0; -40 0; 0 0" dur="11s" repeatCount="indefinite"/>
      </path>
    </g>
  </g>
</svg>
