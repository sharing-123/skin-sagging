<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 400" width="1400" height="400">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fdf4ff">
        <animate attributeName="stop-color" values="#fdf4ff;#f0fbfa;#fff7ed;#fdf4ff" dur="16s" repeatCount="indefinite"/>
      </stop>
      <stop offset="50%" stop-color="#f5f7ff">
        <animate attributeName="stop-color" values="#f5f7ff;#fef2f8;#f0fdfa;#f5f7ff" dur="16s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#eff6ff">
        <animate attributeName="stop-color" values="#eff6ff;#fdf2f8;#fff7ed;#eff6ff" dur="16s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="42%" r="70%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#e8508a"/>
      <stop offset="100%" stop-color="#ff9472"/>
    </linearGradient>
    <radialGradient id="logoPulse" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff6f9c" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#ff6f9c" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#94a3b8" opacity="0.16"/>
    </pattern>
    <clipPath id="frame">
      <rect x="0" y="0" width="1400" height="400" rx="30"/>
    </clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <rect x="0" y="0" width="1400" height="400" fill="url(#bgGrad)"/>
    <rect x="0" y="0" width="1400" height="400" fill="url(#dots)"/>
    <rect x="0" y="0" width="1400" height="400" fill="url(#glow)"/>

    <g opacity="0.8">
      <line x1="980" y1="90" x2="1140" y2="150" stroke="#cbd5e1" stroke-width="1.4"/>
      <line x1="1140" y1="150" x2="1080" y2="255" stroke="#cbd5e1" stroke-width="1.4"/>
      <line x1="1080" y1="255" x2="1220" y2="300" stroke="#cbd5e1" stroke-width="1.4"/>
      <line x1="900" y1="290" x2="1080" y2="255" stroke="#cbd5e1" stroke-width="1.4"/>
    </g>

    <g>
      <circle cx="980" cy="90" r="11" fill="#F2A93B" opacity="0.85">
        <animate attributeName="cy" values="90;70;90" dur="6.4s" repeatCount="indefinite"/>
      </circle>
      <circle cx="1140" cy="150" r="15" fill="#FF6B6B" opacity="0.85">
        <animate attributeName="cy" values="150;128;150" dur="7.6s" repeatCount="indefinite"/>
      </circle>
      <circle cx="1080" cy="255" r="9" fill="#4ECDC4" opacity="0.85">
        <animate attributeName="cy" values="255;276;255" dur="5.5s" repeatCount="indefinite"/>
      </circle>
      <circle cx="1220" cy="300" r="13" fill="#9B5DE5" opacity="0.85">
        <animate attributeName="cy" values="300;280;300" dur="8.2s" repeatCount="indefinite"/>
      </circle>
      <circle cx="900" cy="290" r="8" fill="#F2A93B" opacity="0.7">
        <animate attributeName="cy" values="290;308;290" dur="6.9s" repeatCount="indefinite"/>
      </circle>
      <circle cx="1310" cy="200" r="6" fill="#4ECDC4" opacity="0.6">
        <animate attributeName="cy" values="200;218;200" dur="5.8s" repeatCount="indefinite"/>
      </circle>
    </g>

    <g transform="translate(230,196)">
      <circle r="132" fill="none" stroke="#f4b6c2" stroke-width="1.4" stroke-dasharray="2 10" opacity="0.7">
        <animateTransform attributeName="transform" type="rotate" from="0 0 0" to="360 0 0" dur="40s" repeatCount="indefinite"/>
      </circle>

      <circle r="100" fill="url(#logoPulse)">
        <animate attributeName="r" values="92;108;92" dur="4.5s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.55;0.85;0.55" dur="4.5s" repeatCount="indefinite"/>
      </circle>

      <circle cx="230" cy="196" r="6" fill="#FF6B6B" transform="translate(-230,-196)">
        <animateMotion dur="11s" repeatCount="indefinite" path="M230,64 A132,132 0 1,1 229.9,64"/>
      </circle>
      <circle cx="230" cy="196" r="4.5" fill="#4ECDC4" transform="translate(-230,-196)">
        <animateMotion dur="11s" begin="-5.5s" repeatCount="indefinite" path="M230,64 A132,132 0 1,1 229.9,64"/>
      </circle>

      <g>
        <animateTransform attributeName="transform" type="translate" values="0,0; 0,-10; 0,0" dur="5s" repeatCount="indefinite"/>
        <image href="data:image/png;base64," x="-86" y="-95" width="172" height="190" preserveAspectRatio="xMidYMid meet"/>
      </g>
    </g>

    <g font-family="Segoe UI, Arial, sans-serif">
      <text x="378" y="182" font-size="66" font-weight="800" fill="url(#titleGrad)" letter-spacing="3">
        RISETKU
        <animate attributeName="opacity" values="0.94;1;0.94" dur="4s" repeatCount="indefinite"/>
      </text>
      <text x="380" y="222" font-size="19" font-weight="600" fill="#475569" letter-spacing="0.5">
        Skin Sagging Literature Visual Analytics
      </text>
      <text x="380" y="253" font-size="13.5" font-weight="500" fill="#94a3b8">
        Thematic mapping, treatment pathways, and publication trends
      </text>
    </g>

    <g transform="translate(0,340)">
      <path d="M -100 24 Q 100 -8 300 24 T 700 24 T 1100 24 T 1500 24" fill="none" stroke="#FF6B6B" stroke-width="2.2" opacity="0.4">
        <animateTransform attributeName="transform" type="translate" values="-40 0; 0 0; -40 0" dur="9s" repeatCount="indefinite"/>
      </path>
      <path d="M -100 36 Q 100 8 300 36 T 700 36 T 1100 36 T 1500 36" fill="none" stroke="#4ECDC4" stroke-width="2.2" opacity="0.4">
        <animateTransform attributeName="transform" type="translate" values="0 0; -40 0; 0 0" dur="11s" repeatCount="indefinite"/>
      </path>
      <path d="M -100 48 Q 100 24 300 48 T 700 48 T 1100 48 T 1500 48" fill="none" stroke="#9B5DE5" stroke-width="2" opacity="0.3">
        <animateTransform attributeName="transform" type="translate" values="-25 0; 5 0; -25 0" dur="13s" repeatCount="indefinite"/>
      </path>
    </g>
  </g>
</svg>
