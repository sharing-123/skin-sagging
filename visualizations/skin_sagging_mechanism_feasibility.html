<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Feasibility of Skin Sagging Mechanisms in Literature</title>
<script src="https://cdn.jsdelivr.net/npm/echarts@5.5.0/dist/echarts.min.js"></script>
<style>
body { background: #ffffff; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; font-family: sans-serif; }
#chart { width: 1000px; height: 600px; background: #ffffff; padding: 20px; }
</style>
</head>
<body>
<div id="chart"></div>
<script>
const chart = echarts.init(document.getElementById('chart'));
const option = {
    title: {
        text: 'Preliminary Feasibility of Skin Sagging Mechanisms in Literature',
        left: 'center',
        top: 10,
        textStyle: { color: '#0f172a', fontSize: 22, fontWeight: 'bold' }
    },
    grid: { left: '10%', right: '10%', bottom: '15%', top: '20%', containLabel: true },
    xAxis: {
        type: 'category',
        data: ['Photoaging Process', 'Collagen Depletion', 'Fibroblast Decline', 'SMAS Weakening', 'Elastin Fragmentation'],
        axisLabel: {
            fontSize: 14,
            fontWeight: 'bold',
            color: '#1e293b',
            interval: 0,
            width: 140,
            overflow: 'break',
            align: 'center'
        },
        axisLine: { lineStyle: { color: '#cbd5e1', width: 2 } }
    },
    yAxis: {
        type: 'value',
        name: 'Total Cumulative Citations',
        nameTextStyle: { fontSize: 14, fontWeight: 'bold', color: '#64748b' },
        splitLine: { lineStyle: { type: 'dashed', color: '#e2e8f0' } }
    },
    series: [
        {
            type: 'bar',
            stack: 'Total',
            itemStyle: { borderColor: 'transparent', color: 'transparent' },
            data: [0, 71, 78, 85, 88]
        },
        {
            type: 'bar',
            stack: 'Total',
            label: {
                show: true,
                position: 'top',
                fontWeight: 'bold',
                color: '#0f172a',
                fontSize: 16,
                formatter: '+ {c} Citations'
            },
            itemStyle: { color: '#FF6B6B', borderRadius: [6, 6, 6, 6] },
            data: [71, 7, 7, 3, 2]
        }
    ]
};
chart.setOption(option);
</script>
</body>
</html>
