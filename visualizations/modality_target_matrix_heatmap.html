<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Modality versus Clinical Target Matrix</title>
<script src="https://cdn.jsdelivr.net/npm/echarts@5.5.0/dist/echarts.min.js"></script>
<style>
body { background: #ffffff; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; font-family: sans-serif; }
#chart { width: 1000px; height: 600px; background: #ffffff; padding: 20px; }
</style>
</head>
<body>
<div id="chart"></div>
<script>
const chart = echarts.init(document.getElementById('chart'));
const data = [[0,0,66],[0,1,1],[0,2,20],[0,3,10],[1,0,14],[1,1,2],[1,2,3],[1,3,1],[2,0,29],[2,1,0],[2,2,4],[2,3,10],[3,0,6],[3,1,14],[3,2,0],[3,3,1],[4,0,3],[4,1,2],[4,2,1],[4,3,0]];
const option = {
    title: {
        text: 'Decision Support Matrix: Modality versus Clinical Target',
        left: 'center',
        top: 10,
        textStyle: { color: '#0f172a', fontSize: 24, fontWeight: 'bold' }
    },
    grid: { left: '18%', right: '10%', bottom: '22%', top: '18%', containLabel: true },
    xAxis: {
        type: 'category',
        data: ['Skin Tightening', 'Face Lifting', 'Rejuvenation', 'Muscle Toning', 'Collagen Synthesis'],
        axisLabel: {
            fontSize: 14,
            fontWeight: 'bold',
            color: '#1e293b',
            interval: 0
        },
        splitArea: { show: true }
    },
    yAxis: {
        type: 'category',
        data: ['Radiofrequency', 'EMS and Stimulation', 'HIFU and Ultrasound', 'Laser and Light'],
        axisLabel: {
            fontSize: 14,
            fontWeight: 'bold',
            color: '#1e293b'
        },
        splitArea: { show: true }
    },
    visualMap: {
        min: 0,
        max: 70,
        calculable: true,
        orient: 'horizontal',
        left: 'center',
        bottom: 10,
        itemWidth: 25,
        itemHeight: 450,
        text: ['High', 'Low'],
        textGap: 15,
        textStyle: { fontWeight: 'bold', color: '#0f172a', fontSize: 15 },
        inRange: { color: ['#f8fafc', '#4ECDC4', '#0f172a'] }
    },
    series: [{
        type: 'heatmap',
        data: data,
        label: {
            show: true,
            color: '#0f172a',
            fontWeight: 'bold',
            fontSize: 20,
            textBorderColor: '#ffffff',
            textBorderWidth: 3
        },
        itemStyle: { borderColor: '#ffffff', borderWidth: 4 }
    }]
};
chart.setOption(option);
</script>
</body>
</html>
