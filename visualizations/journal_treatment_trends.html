<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Asian Demographic Treatment Trends by Journal</title>
<script src="https://cdn.jsdelivr.net/npm/echarts@5.5.0/dist/echarts.min.js"></script>
<style>
body { background: #ffffff; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; font-family: sans-serif; }
#chart { width: 1000px; height: 600px; background: #ffffff; padding: 20px; }
</style>
</head>
<body>
<div id="chart"></div>
<script>
const chart = echarts.init(document.getElementById('chart'));
const option = {
    title: { text: 'Decision Support: Asian Demographic Treatment Trends by Journal', left: 'center', top: 10, textStyle: { color: '#0f172a', fontSize: 22, fontWeight: 'bold' } },
    grid: { left: '22%', right: '15%', bottom: '15%', top: '20%', containLabel: true },
    xAxis: { type: 'value', name: 'Total Publications', nameTextStyle: { fontSize: 14, fontWeight: 'bold', color: '#64748b', padding: [15, 0, 0, 0] }, splitLine: { lineStyle: { type: 'dashed', color: '#e2e8f0' } } },
    yAxis: { type: 'category', data: ['Plast Reconstr Surg', 'J Cosmet Dermatol', 'Lasers Surg Med', 'Dermatol Surg', 'Aesthetic Plast Surg'], axisLabel: { fontSize: 14, fontWeight: 'bold', color: '#1e293b' }, axisLine: { lineStyle: { color: '#cbd5e1', width: 2 } } },
    series: [
        { type: 'scatter', symbolSize: 55, itemStyle: { color: '#F2A93B' }, label: { show: true, position: 'inside', color: '#ffffff', fontWeight: 'bold', fontSize: 15 }, data: [3, 6, 6, 7, 11], z: 3 },
        { type: 'bar', barWidth: 4, itemStyle: { color: '#e2e8f0', borderRadius: 4 }, data: [3, 6, 6, 7, 11], z: 2 }
    ]
};
chart.setOption(option);
</script>
</body>
</html>
