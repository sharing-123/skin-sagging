<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Feasibility Timeline for EMS and Thermal Devices</title>
<script src="https://cdn.jsdelivr.net/npm/echarts@5.5.0/dist/echarts.min.js"></script>
<style>
body { background: #ffffff; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; font-family: sans-serif; }
#chart { width: 1000px; height: 600px; background: #ffffff; padding: 20px; }
</style>
</head>
<body>
<div id="chart"></div>
<script>
const chart = echarts.init(document.getElementById('chart'));
const option = {
    title: { text: 'Preliminary Feasibility Timeline for EMS and Thermal Devices', left: 'center', top: 10, textStyle: { color: '#0f172a', fontSize: 22, fontWeight: 'bold' } },
    grid: { left: '8%', right: '8%', bottom: '15%', top: '25%', containLabel: true },
    xAxis: { type: 'category', boundaryGap: false, data: ['2015', '2016', '2020', '2021', '2022', '2023', '2024', '2025', '2026'], axisLabel: { fontSize: 14, fontWeight: 'bold', color: '#1e293b', margin: 15 }, axisLine: { lineStyle: { color: '#cbd5e1', width: 2 } } },
    yAxis: { type: 'value', name: 'Verified Citations', nameTextStyle: { fontSize: 14, fontWeight: 'bold', color: '#64748b' }, splitLine: { lineStyle: { type: 'dashed', color: '#e2e8f0' } } },
    series: [
        { type: 'line', smooth: true, symbolSize: 14, itemStyle: { color: '#4ECDC4' }, areaStyle: { color: new echarts.graphic.LinearGradient(0, 0, 0, 1, [{ offset: 0, color: 'rgba(78,205,196,0.8)' }, { offset: 1, color: 'rgba(78,205,196,0.1)' }]) }, lineStyle: { width: 5 }, label: { show: true, position: 'top', fontWeight: 'bold', color: '#0f172a', fontSize: 15, formatter: '{c} Studies', distance: 10 }, data: [3, 4, 2, 3, 2, 2, 4, 6, 6] }
    ]
};
chart.setOption(option);
</script>
</body>
</html>
